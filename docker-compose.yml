name: ai-analitik

services:
  ai-analitik:
    build: .
    container_name: ai-analitik
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: ai-analitik-caddy
    depends_on:
      - ai-analitik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
