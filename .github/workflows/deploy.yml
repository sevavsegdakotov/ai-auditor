name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy settings
        run: |
          test -n "$DEPLOY_PATH" || (echo "VPS_DEPLOY_PATH is required" && exit 1)
          test -n "$DEPLOY_HOST" || (echo "VPS_HOST is required" && exit 1)
          test -n "$DEPLOY_USER" || (echo "VPS_USER is required" && exit 1)

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_PORT" ]; then
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Rsync project to server
        run: |
          PORT_OPT=""
          if [ -n "$DEPLOY_PORT" ]; then PORT_OPT="-p $DEPLOY_PORT"; fi
          RSYNC_RSH="ssh -i ~/.ssh/id_deploy $PORT_OPT"
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude ".env" \
            --exclude "data/" \
            -e "$RSYNC_RSH" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy with Docker Compose
        run: |
          PORT_OPT=""
          if [ -n "$DEPLOY_PORT" ]; then PORT_OPT="-p $DEPLOY_PORT"; fi
          BUILD_SHA="${GITHUB_SHA}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ssh -i ~/.ssh/id_deploy $PORT_OPT "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            APP_BUILD_SHA='$BUILD_SHA' APP_BUILD_TIME='$BUILD_TIME' TOP10_STRUCTURE_PARSER_VERSION='v2_strict' docker compose up -d --build
            docker compose ps
          "

      - name: Post-deploy smoke: verify build-info
        run: |
          PORT_OPT=""
          if [ -n "$DEPLOY_PORT" ]; then PORT_OPT="-p $DEPLOY_PORT"; fi
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-8)"
          ssh -i ~/.ssh/id_deploy $PORT_OPT "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            SHORT_SHA='$SHORT_SHA'
            RESP=\$(curl -fsS http://127.0.0.1:8011/build-info)
            export RESP SHORT_SHA
            python3 - <<'PY'
import json, os, sys
resp = json.loads(os.environ['RESP'])
short_sha = os.environ['SHORT_SHA']
build_sha = str(resp.get('build_sha') or '')
parser = str(resp.get('top10_structure_parser') or '')
if not build_sha.startswith(short_sha):
    raise SystemExit(f'build-info mismatch: expected sha prefix {short_sha}, got {build_sha}')
if parser != 'v2_strict':
    raise SystemExit(f'parser mismatch: expected v2_strict, got {parser}')
print('build-info ok:', build_sha, parser)
PY
          "
